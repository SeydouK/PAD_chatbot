# Tables dont le texte est exporté vers docs/db/ pour le chatbot (voir export_db.py).
# url_env = NOM d'une variable d'environnement contenant l'URL de connexion (jamais le mot de passe ici).
sources:
  - nom: actualites            # préfixe des fichiers générés
    url_env: DATABASE_URL      # ex. postgresql+psycopg2://lecteur:***@localhost:5432/pad
    table: actualites
    id: id                     # clé unique de la ligne
    titre: titre               # colonne de titre (facultatif)
    colonnes: [chapeau, contenu]   # colonnes de texte, dans l'ordre ; le HTML est nettoyé
    where: "publie = 1"        # facultatif : ne pas exporter les brouillons
    max_lignes: 500
    libelle: "actualités du PAD"   # facultatif : affiché comme source

