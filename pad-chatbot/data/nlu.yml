version: "3.1"

nlu:
- intent: greet
  examples: |
    - bonjour
    - salut
    - bonsoir
    - coucou
    - hello
    - bonjour, j'ai une question

- intent: goodbye
  examples: |
    - au revoir
    - à bientôt
    - bye
    - bonne journée
    - à la prochaine

- intent: thank
